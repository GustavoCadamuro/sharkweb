.adv-fm{display:flex;gap:6px;flex:none}
.adv-fm button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px;min-height:44px;border:1px solid #23263a;background:#11131b;color:#c9cee3;border-radius:10px;cursor:pointer;font:inherit}
.adv-fm button b{font-size:13px}.adv-fm button small{font-size:11px;color:#7d839b}
.adv-fm button.on{border-color:#3b8cff;background:#14213a;color:#fff}
.adv-cv{flex:1;min-height:0;width:100%;position:relative}
.adv-cv canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px -10px #000}
.adv-ct{overflow:auto;padding:12px 16px 18px;display:flex;flex-direction:column;gap:6px;border-left:1px solid #1c1f2e;min-height:0}
.adv-ct>label,#adimw>label{font-size:12px;color:#8a90a8;margin:8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.adv-ct label i{font-style:normal;color:#6d7188}
.adv-ct textarea,.adv-ct>input{width:100%;box-sizing:border-box;background:#0b0d14;border:1px solid #23263a;color:#e6e9f5;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:none}
.adv-ct textarea:focus,.adv-ct>input:focus{outline:0;border-color:#3b8cff}
.adv-r{background:none;border:0;color:#6fa8ff;font:inherit;font-size:12px;cursor:pointer;padding:4px 0;white-space:nowrap}
.adv-r[hidden],#adimw[hidden]{display:none}
.adv-st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adv-st button{background:none;border:2px solid transparent;border-radius:12px;padding:3px;cursor:pointer;color:#aab0c8;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.adv-st button canvas{width:100%;height:auto;aspect-ratio:1;border-radius:8px;display:block}
.adv-st button.on{border-color:#3b8cff;color:#fff}
.adv-im{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.adv-t{flex:none;width:64px;height:64px;box-sizing:border-box;border-radius:10px;border:2px solid #23263a;background:#0b0d14 center/cover no-repeat;color:#aab0c8;font:inherit;font-size:11px;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;cursor:pointer;overflow:hidden;margin:0}
.adv-t img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px}
.adv-t.on{border-color:#3b8cff}
.adv-t.bad{display:none}
.adv-co{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 2px}
.adv-sw{width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:2px solid #0f121b;box-shadow:0 0 0 1px #2c3150;cursor:pointer;padding:0;position:relative;display:inline-block;overflow:hidden}
.adv-sw.on{box-shadow:0 0 0 2px #fff}
.adv-cu{background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#3b82f6,#a855f7,#f43f5e);margin:0}
.adv-cu input{position:absolute;inset:-8px;opacity:0;width:48px;height:48px;cursor:pointer;padding:0;border:0}
.adv-tip{margin:10px 0 0;font-size:12px;color:#6d7188;line-height:1.4}
.adv-f{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #1c1f2e;justify-content:flex-end;flex:none}
.adv-f .b,.adv-f .b2{min-width:150px}
body.adv-on .ov{z-index:96!important}body.adv-on #toast{z-index:97!important}
.trl{display:block;width:100%;background:none;border:1px dashed #2c3150;color:#9aa0b8;border-radius:12px;padding:11px 14px;font:inherit;font-size:13px;cursor:pointer;margin-top:16px}
.trl:hover{border-color:#3b8cff;color:#cfd4ea}
.trl b{background:#1f2335;border-radius:10px;padding:1px 8px;margin-left:4px;color:#cfd4ea}
.trl2{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.tri{display:flex;align-items:center;gap:8px;background:#0b0d14;border:1px solid #23263a;border-radius:12px;padding:10px}
.trn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trn span{font-size:12px;color:#7d839b}
.tri .b2{flex:none;padding:8px 12px;min-height:40px}
.tri .trx{padding:8px 11px}
